<script>
  (function () {
    var el = document.getElementById('brandRotate');
    if (!el) return;
    var NB = ' ';
    var words = ['Wei' + NB + 'Hao', 'a PhD', 'a Founder', 'an investor', 'a friend'];
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { el.textContent = words[0]; return; }
    var wi = 0, ci = 0, deleting = false;
    function tick() {
      var w = words[wi];
      if (!deleting) {
        ci++;
        el.textContent = w.slice(0, ci);
        if (ci === w.length) { deleting = true; return setTimeout(tick, 1500); }
        return setTimeout(tick, 95);
      }
      ci--;
      el.textContent = w.slice(0, ci);
      if (ci === 0) { deleting = false; wi = (wi + 1) % words.length; return setTimeout(tick, 380); }
      return setTimeout(tick, 45);
    }
    el.textContent = '';
    setTimeout(tick, 900);
  })();
</script>
