<!doctype html>
<html lang="{{ site.locale | slice: 0,2 | default: 'en' }}" data-theme-default>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "" %}{{ page.title }} · {{ site.name }}{% else %}{{ site.name }} · {{ site.description }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.name }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ page.title | default: site.name }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ '/images/Wei.png' | absolute_url }}">

  <!-- Avoid theme flash: set data-theme before paint -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('rd-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/redesign.css' | relative_url }}">
  <link rel="icon" href="{{ '/images/Wei.png' | relative_url }}">
</head>
<body class="rd">
  <div class="cyberbg" aria-hidden="true">
    <span class="cyber-grid"></span>
    <span class="cyber-glow"></span>
    <span class="cyber-scan"></span>
  </div>
  <a class="skip" href="#main">Skip to content</a>
  {% include redesign/nav.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include redesign/footer.html %}

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('themeToggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var cur = root.getAttribute('data-theme');
        if (!cur) cur = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var next = cur === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('rd-theme', next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
